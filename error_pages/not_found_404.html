<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Escaped</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow:hidden;
}

.container{
    text-align:center;
    max-width:700px;
    padding:40px;
}

h1{
    font-size:9rem;
    margin-bottom:10px;
    animation:bounce 1.8s infinite;
}

.face{
    font-size:4rem;
    margin:20px 0;
    animation:spin 8s linear infinite;
}

h2{
    font-size:2rem;
    margin-bottom:20px;
}

p{
    color:#d1d5db;
    font-size:1.1rem;
    line-height:1.6;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    font-size:1rem;
    border:none;
    border-radius:50px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08) rotate(-2deg);
    background:#16a34a;
}

.ghost{
    position:absolute;
    font-size:40px;
    animation:float 12s linear infinite;
    opacity:.25;
}

.g1{top:10%;left:-50px;animation-delay:0s;}
.g2{top:40%;left:-100px;animation-delay:3s;}
.g3{top:75%;left:-80px;animation-delay:6s;}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes float{
    from{
        transform:translateX(-100px);
    }
    to{
        transform:translateX(calc(100vw + 200px));
    }
}
</style>

</head>
<body>

<div class="ghost g1">👻</div>
<div class="ghost g2">🦆</div>
<div class="ghost g3">🛸</div>

<div class="container">

<h1>404</h1>

<div class="face">(╯°□°）╯︵ ┻━┻</div>

<h2>Oops... the page ran away.</h2>

<p>
We looked under the couch.<br>
We checked the fridge.<br>
We even asked the rubber duck.<br><br>

Nobody knows where this page went.
It probably got promoted to production on a Friday.
</p>

<button onclick="location.href='/'">
🏠 Take Me Home
</button>

</div>

</body>
</html>
