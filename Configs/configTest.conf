server {
	listen 8080;
	# host localhost;
	# host 127.0.1.1;
	host 0.0.0.0;

	server_name exemple.com hamid.com;
	client_max_body_size 1m;
	error_page 404 error_pages/404.html;

	root ./www ;

	location / {
		root ./www;
		methods GET DELETE;
		# index index.html;

		autoindex on;
	}

	location /uploads {
		methods GET POST DELETE;
		root ./www/uploads;
		index index.html;
		upload_path ./www/uploads/storage;
	}

	location .py {
		methods GET POST;
		cgi_pass .py /usr/bin/python3;
	}

	location /ancienne-page {
		return 301 /index.html;
	}

	location /google {
		return 301 https://google.com;
	}

	location /hamid {
		return 301 https://youtube.com;
	}
}

