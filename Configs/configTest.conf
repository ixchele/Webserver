server {
	listen 8080;
	listen 9090;
	host 127.0.0.1;
	host 127.0.1.1;

	server_name exemple.com hamid.com;
	client_max_body_size 1m;
	error_page 404 error_pages/404.html;

	root ./wwwb ;

	location / {
		root ./www;
		methods GET;
		index index.html;
		autoindex on;
	}

	location /uploads {
		methods GET POST DELETE;
		root ./www/uploads;
		upload_path ./www/uploads/storage;
	}

	location .py {
		methods GET POST;
		cgi_pass .py /usr/bin/python3;
	}

	location /ancienne-page {
		return 301 /index.html;
	}
}
