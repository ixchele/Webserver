server {
    listen 8080;
    host 0.0.0.0;
    root ./;
    index index.htm;
    autoindex on;

    location / {
        methods GET;
        autoindex on;
    }

    location /upload {
        methods GET POST DELETE;
        upload_path ./www/uploads/storage;
    }

    location .py {
		methods GET POST DELETE;
		cgi_pass .py /usr/bin/python3;
    }

    location /cgi {
        methods GET POST;
        cgi_pass .py /usr/bin/python3;
    }
}
